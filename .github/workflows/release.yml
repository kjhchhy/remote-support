name: Build installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: ./build.ps1
      - name: Test without installing RustDesk
        shell: powershell
        run: ./tests/test.ps1
      - name: Test real installation and configuration on disposable runner
        shell: powershell
        timeout-minutes: 10
        run: ./tests/integration.ps1
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/RemoteSupportSetup.exe dist/SHA256SUMS.txt --title "원격지원 설치 도우미 $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
